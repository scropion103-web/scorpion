# Packages allowed (true) or not (false) to run install scripts (Prisma engines, native binaries, etc.)
# pnpm 10.26+ uses `allowBuilds`; `onlyBuiltDependencies` is kept for older pnpm versions.
allowBuilds:
  '@prisma/engines': true
  '@tailwindcss/oxide': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  '@parcel/watcher': false
  '@swc/core': false
onlyBuiltDependencies:
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
